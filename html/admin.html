<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avatar Admin</title>

    <link rel="stylesheet" href="../CSS/admin.css">

    <link rel="stylesheet" href="../CSS/general.css">

</head>


<body>

    <h1>Avatar Editor</h1>


    <!-- ================================================= -->
    <!-- Avatar Preview -->
    <!-- ================================================= -->

    <div class="avatar-container">

        <div class="avatar-stage">

            <!-- Tail must be behind body -->
            <img id="tailImg">

            <!-- Ear -->
            <img id="earImg">

            <!-- Body -->
            <img id="bodyImg">

            <!-- Eye -->
            <img id="eyeImg">

        </div>

    </div>


    <br>


    <!-- ================================================= -->
    <!-- Selection -->
    <!-- ================================================= -->

    <select id="animal">

        <option value="cat">
            Cat
        </option>

        <option value="dog">
            Dog
        </option>

    </select>


    <select id="body">

        <option value="body1">
            Body 1
        </option>

        <option value="body2">
            Body 2
        </option>

        <option value="body3">
            Body 3
        </option>

        <option value="body4">
            Body 4
        </option>

    </select>


    <select id="eye">

        <option value="eye1">
            Eye 1
        </option>

        <option value="eye2">
            Eye 2
        </option>

        <option value="eye3">
            Eye 3
        </option>

        <option value="eye4">
            Eye 4
        </option>

    </select>


    <select id="ear">

        <option value="ear1">
            Ear 1
        </option>

        <option value="ear2">
            Ear 2
        </option>

        <option value="ear3">
            Ear 3
        </option>

        <option value="ear4">
            Ear 4
        </option>

    </select>


    <select id="tail">

        <option value="tail1">
            Tail 1
        </option>

        <option value="tail2">
            Tail 2
        </option>

        <option value="tail3">
            Tail 3
        </option>

        <option value="tail4">
            Tail 4
        </option>

    </select>


    <!-- ================================================= -->
    <!-- Position Panel -->
    <!-- ================================================= -->

    <div class="panel">


        <!-- ========================== -->
        <!-- Eye -->
        <!-- ========================== -->

        <h3>Eye</h3>

        <label>
            X
            <input id="eyeX" type="number" step="0.1">
        </label>

        <label>
            Y
            <input id="eyeY" type="number" step="0.1">
        </label>

        <label>
            Scale
            <input id="eyeScale" type="number" step="0.01" min="0.01">
        </label>


        <!-- ========================== -->
        <!-- Ear -->
        <!-- ========================== -->

        <h3>Ear</h3>

        <label>
            X
            <input id="earX" type="number" step="0.1">
        </label>

        <label>
            Y
            <input id="earY" type="number" step="0.1">
        </label>

        <label>
            Scale
            <input id="earScale" type="number" step="0.01" min="0.01">
        </label>

        <label>

            Front

            <select id="earFront">

                <option value="false">
                    Behind Body
                </option>

                <option value="true">
                    Front of Body
                </option>

            </select>

        </label>


        <!-- ========================== -->
        <!-- Tail -->
        <!-- ========================== -->

        <h3>Tail</h3>

        <label>
            X
            <input id="tailX" type="number" step="0.1">
        </label>

        <label>
            Y
            <input id="tailY" type="number" step="0.1">
        </label>

        <label>
            Scale
            <input id="tailScale" type="number" step="0.01" min="0.01">
        </label>


        <br><br>


        <button id="saveBtn" type="button">
            Save Configuration
        </button>


    </div>


    <!-- ================================================= -->
    <!-- JavaScript -->
    <!-- ================================================= -->

    <script src="../JS/avatar.js?v=dev"></script>

    <script src="../JS/admin.js?v=dev"></script>

</body>

</html>
