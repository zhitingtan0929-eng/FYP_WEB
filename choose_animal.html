<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Animal - WonderPaws Foundry</title>
    <link rel="stylesheet" href="CSS/general.css">
    <link rel="stylesheet" href="CSS/choose_animal.css">
    <link rel="icon" type="image/svg+xml" href="SVG/favicons.svg">
</head>

<body>
    <div class="ChooseAnimal">
        <div class="content">
            <!-- <h1>Choose Your Animal</h1>
            <p>Select the type of animal you want to breed:</p> -->
            <div id="ChooseAnimalbutton">
                <button class="backHome" onclick="window.location.href='index.html';">
                    <svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74" fill="none">
                        <rect x="1.62281" y="1.62281" width="70.7544" height="70.7544" rx="35.3772" fill="#FFF9F1"
                            stroke="currentColor" stroke-width="3.24561" />
                        <path d="M36 49L24 37L36 25M25.6667 37H50" stroke="currentColor" stroke-width="6.12259"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button id="confirmBtn" class="rightpaws-button" type="button" onclick="confirmAnimal()">
                    Confirm
                    <svg id="nextButtonIcon" xmlns="http://www.w3.org/2000/svg" width="25" height="29"
                        viewBox="0 0 25 29" fill="none">
                        <path
                            d="M4.10474 16.2741L4.07954 16.3156C1.68478 20.2549 5.24093 22.8769 7.5276 22.1966C9.76404 21.5313 11.9911 20.5686 14.1077 17.7877C15.5287 15.9207 15.3064 13.871 14.5519 11.9442C13.3607 8.90179 11.8733 8.25927 8.73243 6.83584C4.2829 4.81932 2.0404 10.4117 3.94274 12.6198C5.34033 14.2421 5.01007 14.7852 4.10474 16.2741Z"
                            fill="currentColor" />
                        <ellipse cx="3.0178" cy="3.51652" rx="3.0178" ry="3.51652"
                            transform="matrix(0.453188 -0.891415 -0.891415 -0.453188 15.7852 28.1679)"
                            fill="currentColor" />
                        <ellipse cx="3.26328" cy="4.05741" rx="3.26328" ry="4.05741"
                            transform="matrix(0.198867 -0.980026 -0.980026 -0.198867 23.4669 22.9606)"
                            fill="currentColor" />
                        <ellipse cx="3.26328" cy="4.05741" rx="3.26328" ry="4.05741"
                            transform="matrix(-0.162645 -0.986685 -0.986685 0.162645 24.9405 13.2917)"
                            fill="currentColor" />
                        <ellipse cx="3.26328" cy="4.05741" rx="3.26328" ry="4.05741"
                            transform="matrix(-0.479057 -0.877784 -0.877784 0.479057 20.5567 5.72892)"
                            fill="currentColor" />
                    </svg>
                </button>
            </div>
            <div class="avatar-container">

                <div class="avatar-stage">

                    <img id="tailImg" alt="Tail">

                    <img id="earImg" alt="Ear">

                    <img id="bodyImg" alt="Body">

                    <img id="eyeImg" alt="Eyes">

                </div>
            </div>
        </div>
    </div>
    <div class="animal-selection">
        <div class="content">
            <!-- <button onclick="chooseAnimal('cat')">🐱 Cat</button>
            <button onclick="chooseAnimal('dog')">🐶 Dog</button> -->
            <button id="catBtn" class="choose-btn" type="button" onclick="selectAnimal('cat')">
                <div class="choose-btn-image">
                    <img src="img/Cat.png" alt="Cat Icon" class="animal-icon">
                </div>
                Cat
            </button>


            <button id="dogBtn" class="choose-btn" type="button" onclick="selectAnimal('dog')">
                <div class="choose-btn-image">
                    <img src="img/Dog.png" alt="Dog Icon" class="animal-icon">
                </div>
                Dog
            </button>
        </div>
    </div>

    <script src="JS/avatar.js?v=dev" defer></script>
    <script src="JS/chooseAnimal.js"></script>
</body>

</html>
